<style>
  html, body { margin: 0; height: 100%; background: #0b0c10; color: #8a90a0; font: 13px/1.4 system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  button, input { font: inherit; color: inherit; }
  svg { fill: currentColor; }

  #bar { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px 12px; min-height: 26px; padding: 0 8px; }
  #btns { display: flex; gap: 6px; }
  .ib { width: 26px; height: 26px; padding: 4px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center;
        background: #171a22; border: 1px solid #2b3040; border-radius: 4px; cursor: pointer; }
  .ib:hover { border-color: #3a4054; }
  .ib svg { width: 100%; height: 100%; }
  .ib svg[hidden] { display: none; }
  #fpsbox { display: flex; align-items: center; gap: 8px; }
  #fpsauto { margin: 0; accent-color: #3dd68c; cursor: pointer; }
  #fpsautolabel { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  #fps { width: 120px; margin: 0; accent-color: #3dd68c; cursor: pointer; }
  #fpsnum { width: 52px; background: #171a22; border: 1px solid #2b3040; border-radius: 4px; padding: 1px 4px; }
  #fpsnum:focus { outline: none; border-color: #3dd68c; }
  #fpsbox.auto #fpsnum, #fpsbox.auto #fps { opacity: .7; }

  #game { display: flex; flex-direction: column; align-items: center; }
  #stage { position: relative; line-height: 0; }
  #c { display: block; width: min(100vw, calc((100vh - 70px) * 16 / 9)); height: auto; image-rendering: pixelated; background: #14161c; }
  #pause { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
           background: rgba(11, 12, 16, .74); color: #cfd3dc; font-size: clamp(18px, 4.5vw, 30px); line-height: 1.3; cursor: pointer; text-align: center; }
  #pause[hidden] { display: none; }
  #pause small { font-size: 13px; color: #8a90a0; }
  #help { min-height: 20px; margin: 6px 12px 0; text-align: center; }

  /* сенсорное управление: показывается на устройствах с касанием */
  .touch-only { display: none; }
  .zone { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
          background: #171a22; border: 1px solid #2b3040; border-radius: 18px; box-sizing: border-box; }
  .zone svg { width: 44px; height: 44px; }
  #pad { display: none; margin: 8px; width: calc(100% - 16px); }
  #pad .half { flex: 1; display: flex; align-items: center; justify-content: center; color: #6b7285; border-radius: 16px; }
  #pad .half.on, #jump.on { background: rgba(61, 214, 140, .2); color: #3dd68c; }
  #jump { margin: 8px; width: calc(100% - 16px); align-items: center; justify-content: center; color: #6b7285; }

  html.touch #fpsbox, html.touch #help { display: none; }
  html.touch body { justify-content: flex-start; }
  html.touch #game { display: grid; width: 100vw; flex: 1; min-height: 0; justify-items: center; align-items: center;
                     grid-template-areas: "stage stage" "pad jump"; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; }
  html.touch #pad, html.touch #jump { align-self: end; margin-bottom: max(8px, env(safe-area-inset-bottom)); }
  html.touch #stage { grid-area: stage; }
  html.touch #c { width: 100vw; }
  html.touch #pad { grid-area: pad; display: flex; height: clamp(110px, 22vh, 190px); }
  html.touch #jump { grid-area: jump; display: flex; height: clamp(110px, 22vh, 190px); }
  @media (orientation: landscape) {
    html.touch body { justify-content: center; }
    html.touch #game { grid-template-areas: "pad stage jump"; grid-template-columns: 1fr auto 1fr; grid-template-rows: auto; }
    html.touch #c { width: min(calc(100vw - 200px), calc((100vh - 34px) * 16 / 9)); }
    html.touch #pad, html.touch #jump { height: min(60vh, 200px); align-self: center; margin-bottom: 8px; }
  }

<script>
/* Физика и разбор уровней. Никакого DOM: тот же код гоняет tools/solve.js в Node. */
(function (root) {
  'use strict';

  var T = 20;        // размер тайла, px
  var COLS = 32;
  var ROWS = 18;     // поле 640x360
  var SIZE = 14;     // сторона куба

  // всё в px и кадрах (60 кадров/с)
  var C = {
    grav: 0.42,
    maxFall: 8.5,
    slide: 1.4,        // скорость скольжения по стене, когда держишься
    accel: 0.55,
    airAccel: 0.4,
    fric: 0.6,
    airDrag: 0.12,
    maxRun: 3.2,
    // высота прыжка зависит от того, сколько держишь кнопку: стартовая скорость
    // jump, потом пока кнопка зажата (до jumpFrames кадров) к ней добавляется jumpBoost за кадр
    jump: 3.0,
    jumpBoost: 0.62,
    jumpFrames: 10,
    // отскок от стены растёт с удержанием так же, как обычный прыжок: короткий тап -
    // слабый подпрыг, на нём можно карабкаться вдоль стены; полное удержание -
    // сильный отскок (по горизонтали wallJX + wallFrames * wallBoostX = 4.2, как раньше)
    wallJump: 3.0,
    wallBoost: 0.62,
    wallJX: 1.2,
    wallBoostX: 0.3,
    wallFrames: 10,
    coyote: 6,
    wallCoyote: 5,
    buffer: 6
  };

  var EMPTY = 0, SOLID = 1, SPIKE = 2;

  // Уровень -> сетка. ops: ['#'|'^'|'.', x, y, w, h], рамка добавляется сама.
  function parseLevel(def) {
    var grid = new Uint8Array(COLS * ROWS);
    var i, x, y;
    function fill(ch, x0, y0, w, h) {
      var v = ch === '#' ? SOLID : ch === '^' ? SPIKE : EMPTY;
      for (y = y0; y < y0 + h; y++) {
        for (x = x0; x < x0 + w; x++) {
          if (x >= 0 && y >= 0 && x < COLS && y < ROWS) grid[y * COLS + x] = v;
        }
      }
    }
    fill('#', 0, 0, COLS, 1);
    fill('#', 0, ROWS - 1, COLS, 1);
    fill('#', 0, 0, 1, ROWS);
    fill('#', COLS - 1, 0, 1, ROWS);
    for (i = 0; i < def.ops.length; i++) {
      var o = def.ops[i];
      fill(o[0], o[1], o[2], o[3], o[4]);
    }
    return {
      name: def.name,
      grid: grid,
      sx: def.start[0] * T + (T - SIZE) / 2,
      sy: (def.start[1] + 1) * T - SIZE,
      ex: def.exit[0],
      ey: def.exit[1]
    };
  }

  function newState() {
    return { x: 0, y: 0, vx: 0, vy: 0, g: false, jh: false, buf: 0, coyote: 0,
             wallT: 0, wallSide: 0, grip: 0, jt: 0, jb: 0, jx: 0, ev: 0, dead: false, won: false };
  }

  function reset(s, lv) {
    s.x = lv.sx; s.y = lv.sy; s.vx = 0; s.vy = 0;
    s.g = false; s.jh = false; s.buf = 0; s.coyote = 0;
    s.wallT = 0; s.wallSide = 0; s.grip = 0; s.jt = 0; s.jb = 0; s.jx = 0; s.ev = 0;
    s.dead = false; s.won = false;
  }

  function copyState(a, b) {
    b.x = a.x; b.y = a.y; b.vx = a.vx; b.vy = a.vy; b.g = a.g; b.jh = a.jh;
    b.buf = a.buf; b.coyote = a.coyote; b.wallT = a.wallT; b.wallSide = a.wallSide;
    b.grip = a.grip; b.jt = a.jt; b.jb = a.jb; b.jx = a.jx; b.ev = a.ev; b.dead = a.dead; b.won = a.won;
  }

  // Бокс (x,y,SIZE) пересекает твёрдый тайл? Всё за краем поля - стена.
  function hitsSolid(lv, x, y) {
    var x0 = Math.floor(x / T), x1 = Math.floor((x + SIZE - 0.001) / T);
    var y0 = Math.floor(y / T), y1 = Math.floor((y + SIZE - 0.001) / T);
    var tx, ty;
    for (ty = y0; ty <= y1; ty++) {
      for (tx = x0; tx <= x1; tx++) {
        if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return true;
        if (lv.grid[ty * COLS + tx] === SOLID) return true;
      }
    }
    return false;
  }

  function hitsSpike(lv, x, y) {
    var m = 4; // шипы бьют только по "ядру" куба
    var x0 = Math.floor((x + m) / T), x1 = Math.floor((x + SIZE - m) / T);
    var y0 = Math.floor((y + m) / T), y1 = Math.floor((y + SIZE - m) / T);
    var tx, ty;
    for (ty = y0; ty <= y1; ty++) {
      for (tx = x0; tx <= x1; tx++) {
        if (tx >= 0 && ty >= 0 && tx < COLS && ty < ROWS && lv.grid[ty * COLS + tx] === SPIKE) return true;
      }
    }
    return false;
  }

  function approach(v, t, a) {
    return v < t ? Math.min(v + a, t) : Math.max(v - a, t);
  }

  // события шага для звука, на физику не влияют: s.ev = EV_JUMP | EV_WALL | EV_LAND
  var EV_JUMP = 1, EV_WALL = 2, EV_LAND = 4;

  // inp: 1 = влево, 2 = вправо, 4 = прыжок (зажат)
  function step(s, lv, inp) {
    var wasG = s.g;
    s.ev = 0;
    var dir = ((inp & 2) ? 1 : 0) - ((inp & 1) ? 1 : 0);
    var jh = (inp & 4) !== 0;

    if (jh && !s.jh) s.buf = C.buffer; else if (s.buf > 0) s.buf--;
    s.jh = jh;

    // стены рядом (с зазором в 1px)
    var wl = hitsSolid(lv, s.x - 1, s.y);
    var wr = hitsSolid(lv, s.x + 1, s.y);
    s.grip = 0;
    if (!s.g) {
      if (wl || wr) {
        s.wallT = C.wallCoyote;
        s.wallSide = (dir === 1 && wr) ? 1 : (dir === -1 && wl) ? -1 : (wl ? -1 : 1);
      } else if (s.wallT > 0) {
        s.wallT--;
      }
      // держимся за стену только если давим в её сторону
      if (dir === -1 && wl) s.grip = -1;
      else if (dir === 1 && wr) s.grip = 1;
    } else {
      s.wallT = 0;
    }

    // бег; пока держишь прыжок после отскока от стены, куб летит по инерции отскока
    if (!(s.jx !== 0 && s.jt > 0 && jh)) {
      var a = dir === 0 ? (s.g ? C.fric : C.airDrag) : (s.g ? C.accel : C.airAccel);
      s.vx = approach(s.vx, dir * C.maxRun, a);
    }

    // прыжок
    if (s.g) s.coyote = C.coyote; else if (s.coyote > 0) s.coyote--;
    if (s.buf > 0) {
      if (s.coyote > 0) {
        s.vy = -C.jump; s.jt = C.jumpFrames; s.jb = C.jumpBoost; s.jx = 0;
        s.coyote = 0; s.buf = 0; s.g = false; s.ev |= EV_JUMP;
      } else if (s.wallT > 0) {
        s.vy = -C.wallJump; s.jt = C.wallFrames; s.jb = C.wallBoost;
        s.vx = -s.wallSide * C.wallJX; s.jx = -s.wallSide * C.wallBoostX;
        s.wallT = 0; s.buf = 0; s.grip = 0; s.ev |= EV_WALL;
      }
    }
    if (s.jt > 0) {
      if (jh) { s.vy -= s.jb; s.vx += s.jx; s.jt--; } else s.jt = 0;
    }

    // гравитация; на стене с нажатием "в стену" падаем медленно
    s.vy += C.grav;
    if (s.grip !== 0 && s.vy > C.slide) s.vy = C.slide;
    else if (s.vy > C.maxFall) s.vy = C.maxFall;

    // движение по осям, скорости < T, так что туннелирования нет
    var nx = s.x + s.vx;
    if (hitsSolid(lv, nx, s.y)) {
      if (s.vx > 0) nx = Math.floor((nx + SIZE - 0.001) / T) * T - SIZE;
      else nx = (Math.floor(nx / T) + 1) * T;
      s.vx = 0;
    }
    s.x = nx;

    var ny = s.y + s.vy;
    s.g = false;
    if (hitsSolid(lv, s.x, ny)) {
      if (s.vy > 0) { ny = Math.floor((ny + SIZE - 0.001) / T) * T - SIZE; s.g = true; if (!wasG && s.vy > 2.5) s.ev |= EV_LAND; }
      else { ny = (Math.floor(ny / T) + 1) * T; s.jt = 0; }
      s.vy = 0;
    }
    s.y = ny;

    if (hitsSpike(lv, s.x, s.y)) s.dead = true;
    var ex = lv.ex * T, ey = lv.ey * T;
    if (s.x + SIZE > ex && s.x < ex + T && s.y + SIZE > ey && s.y < ey + T) s.won = true;
  }

  var LP = root.LP = root.LP || {};
  LP.sim = { T: T, COLS: COLS, ROWS: ROWS, SIZE: SIZE, C: C, EMPTY: EMPTY, SOLID: SOLID, SPIKE: SPIKE, EV_JUMP: EV_JUMP, EV_WALL: EV_WALL, EV_LAND: EV_LAND,
             parseLevel: parseLevel, newState: newState, reset: reset, copyState: copyState, step: step };
})(typeof globalThis !== 'undefined' ? globalThis : window);
</script>

<script>
/* Отрисовка, ввод, игровой цикл. Рассчитано на слабые машины:

  var ctx = canvas.getContext('2d', { alpha: false });

  var fpsInput = document.getElementById('fps');
  var fpsLabel = document.getElementById('fpslabel');
  var fpsNum = document.getElementById('fpsnum');
  var fpsAutoBox = document.getElementById('fpsauto');
  var fpsBox = document.getElementById('fpsbox');
  var btnPause = document.getElementById('btnPause');
  var btnRestart = document.getElementById('btnRestart');

  var levels = [];

  // ---------- кэш уровня ----------

  cache.width = W; cache.height = H;
  var cctx = cache.getContext('2d', { alpha: false });

  function solidAt(lv, x, y) {
    return x >= 0 && y >= 0 && x < sim.COLS && y < sim.ROWS && lv.grid[y * sim.COLS + x] === sim.SOLID;
  }

  function drawSpike(lv, x, y) {
    var px = x * T, py = y * T, h = 6; // h - зазор: шип в стене или на полу
    // остриё смотрит от соседней стены

    cctx.fillRect(0, 0, W, H);

    for (y = 0; y < sim.ROWS; y++) {           // склеиваем горизонтальные участки

  }

  // ---------- такт физики (всегда 60 в секунду) ----------
  function tick() {

        if (P.ev & sim.EV_JUMP) audio.play('jump');
        if (P.ev & sim.EV_WALL) audio.play('wall');

      else ang += (Math.round(ang / HALF_PI) * HALF_PI - ang) * 0.35; // на земле и на стене встаёт ровно
      if (P.dead) { deaths++; burst(); mode = 1; modeT = 36; updateHud(); audio.play('die'); }
      else if (P.won) { mode = 2; modeT = 40; audio.play('win'); }
    } else if (mode === 1) {
      for (k = 0; k < NP; k++) { ppx[k] += pvx[k]; ppy[k] += pvy[k]; pvy[k] += 0.25; }

    } else if (--modeT <= 0) {

    }
  }

  // ---------- отрисовка; alpha (0..1) - сколько прошло от прошлого такта к следующему ----------
  function render(alpha) {
    var k, x, y, a, rx, ry, rw, rh;
    if (mode === 1) {
      ctx.drawImage(cache, 0, 0);
      needFull = false; lastRect.w = 0; drawX = -1;
      ctx.fillStyle = COLORS.cube;

      for (k = 0; k < NP; k++) ctx.fillRect(ppx[k] + pvx[k] * alpha - ps / 2, ppy[k] + pvy[k] * alpha - ps / 2, ps, ps);
      return;
    }
    x = Math.round(prevX + (P.x - prevX) * alpha);
    y = Math.round(prevY + (P.y - prevY) * alpha);
    a = prevAng + (ang - prevAng) * alpha;
    if (!needFull && x === drawX && y === drawY && a === drawAng) return;   // ничего не изменилось
    if (needFull) {
      ctx.drawImage(cache, 0, 0);
      needFull = false;
    } else if (lastRect.w) {
      ctx.drawImage(cache, lastRect.x, lastRect.y, lastRect.w, lastRect.h, lastRect.x, lastRect.y, lastRect.w, lastRect.h);
    }
    drawX = x; drawY = y; drawAng = a;
    if (Math.abs(a - Math.round(a / HALF_PI) * HALF_PI) < 0.02) {   // ровный куб: быстрый путь без сглаживания
      ctx.fillStyle = COLORS.cubeDark;
      ctx.fillRect(x, y, SIZE, SIZE);
      ctx.fillStyle = COLORS.cube;
      ctx.fillRect(x + 2, y + 2, SIZE - 4, SIZE - 4);
    } else {
      var c = Math.cos(a), s = Math.sin(a), h = SIZE / 2;
      ctx.setTransform(c, s, -s, c, x + h, y + h);

      ctx.fillRect(-h, -h, SIZE, SIZE);
      ctx.fillStyle = COLORS.cube;
      ctx.fillRect(-h + 2, -h + 2, SIZE - 4, SIZE - 4);
      ctx.setTransform(1, 0, 0, 1, 0, 0);

    rw = Math.min(W - rx, SIZE + 10); rh = Math.min(H - ry, SIZE + 10);

  }

    if (txt !== lastHud) { hud.textContent = txt; lastHud = txt; }
  }

  // ---------- частота кадров: авто (по монитору) или вручную ----------
  var FPS_MIN = 30, FPS_MAX = 360;
  var HZ_SNAP = [30, 48, 50, 60, 72, 75, 90, 100, 120, 144, 165, 180, 200, 240, 280, 300, 360];
  var fpsAuto = true, manualCap = 60;
  var monitorHz = 60, hzSeen = 0;      // частота монитора и последнее измерение (нужны два одинаковых подряд)
  var autoDiv = 1;                     // авто: лимит = герцовка / autoDiv (целые доли дают ровный темп кадров)
  var slowSecs = 0, goodSecs = 0, warm = 0;
  var fpsCap = 60, fpsNow = 0, fpsCount = 0, fpsStamp = 0, nextRender = 0, workSum = 0, workN = 0;
  var dts = new Float32Array(30), dtsSorted = new Float32Array(30), dtN = 0;
  var clock = (window.performance && performance.now) ? function () { return performance.now(); } : function () { return Date.now(); };

  try {
    var savedFps = localStorage.getItem('lowplat.fps');
    if (savedFps !== null && savedFps !== 'auto') {
      var sv = parseInt(savedFps, 10);
      if (sv >= FPS_MIN && sv <= FPS_MAX) { fpsAuto = false; manualCap = sv; fpsCap = sv; }
    }
  } catch (e) {}

  function clampFps(v) { return Math.max(FPS_MIN, Math.min(FPS_MAX, v)); }

  function saveFps() {
    try { localStorage.setItem('lowplat.fps', fpsAuto ? 'auto' : String(manualCap)); } catch (e) {}
  }

  function updateFpsLabel() {
    var txt = 'FPS: ' + (fpsNow || '…') + ' · лимит';
    if (fpsLabel.textContent !== txt) fpsLabel.textContent = txt;
  }

  function syncFpsUi() {
    if (document.activeElement !== fpsNum) fpsNum.value = fpsCap;    // пока печатаешь, поле не трогаем
    fpsInput.value = fpsCap;
    fpsAutoBox.checked = fpsAuto;
    fpsBox.className = fpsAuto ? 'auto' : '';
    updateFpsLabel();
  }

  function resetFpsStats() {
    fpsCount = 0; fpsStamp = 0; fpsNow = 0; workSum = 0; workN = 0;
    slowSecs = 0; goodSecs = 0; warm = 1; nextRender = 0;
  }

  function applyAuto() {
    fpsCap = clampFps(Math.round(monitorHz / autoDiv));
    resetFpsStats();
    syncFpsUi();
  }

  function setManual(v) {
    fpsAuto = false; manualCap = v; fpsCap = v;
    saveFps(); resetFpsStats(); syncFpsUi();
  }

  function setAutoMode(on) {
    fpsAuto = on;
    if (on) { autoDiv = 1; applyAuto(); } else { fpsCap = manualCap; resetFpsStats(); syncFpsUi(); }
    saveFps();
  }

  fpsInput.min = FPS_MIN; fpsInput.max = FPS_MAX; fpsInput.step = 1;
  fpsNum.min = FPS_MIN; fpsNum.max = FPS_MAX; fpsNum.step = 1;

  fpsAutoBox.addEventListener('change', function () { setAutoMode(fpsAutoBox.checked); fpsAutoBox.blur(); });
  fpsInput.addEventListener('input', function () { setManual(clampFps(parseInt(fpsInput.value, 10) || 60)); });
  // число вручную: пока печатаешь, подходящее значение применяется сразу, остальное поправится, когда закончишь
  fpsNum.addEventListener('input', function () {
    var v = parseInt(fpsNum.value, 10);
    if (v >= FPS_MIN && v <= FPS_MAX) setManual(v);
  });
  fpsNum.addEventListener('change', function () {
    var v = clampFps(parseInt(fpsNum.value, 10) || fpsCap);   // пусто или мусор -> прежнее значение, вне границ -> ближайшая граница
    fpsNum.value = v;
    setManual(v);
  });
  // после выбора снимаем фокус с ползунка, чтобы стрелки и пробел управляли игрой, а не им
  fpsInput.addEventListener('change', function () { fpsInput.blur(); });
  fpsInput.addEventListener('pointerup', function () { fpsInput.blur(); });

  // частота монитора: медиана 30 интервалов между кадрами браузера, подгоняется к ближайшей стандартной
  function snapHz(hz) {
    var best = 0, bd = 1e9, k, d;
    for (k = 0; k < HZ_SNAP.length; k++) {
      d = Math.abs(hz - HZ_SNAP[k]) / HZ_SNAP[k];
      if (d < bd) { bd = d; best = HZ_SNAP[k]; }
    }
    return bd < 0.04 ? best : clampFps(Math.round(hz));
  }

  function detectHz() {
    var i2, j, v;
    for (i2 = 0; i2 < 30; i2++) {                 // сортировка вставками: без выделения памяти
      v = dts[i2]; j = i2 - 1;
      while (j >= 0 && dtsSorted[j] > v) { dtsSorted[j + 1] = dtsSorted[j]; j--; }
      dtsSorted[j + 1] = v;
    }
    var hz = snapHz(1000 / dtsSorted[15]);
    if (hz === hzSeen && hz !== monitorHz) { monitorHz = hz; if (fpsAuto) applyAuto(); }
    hzSeen = hz;
  }

  // раз в секунду: если кадры не успевают или кадр занимает больше 60% своего времени, лимит делим на целое число;
  // если 10 секунд всё с запасом, возвращаем обратно
  function autoStep(work) {
    var interval = 1000 / fpsCap;
    if (warm > 0) { warm--; return; }
    if (fpsNow < fpsCap * 0.85 || work > interval * 0.6) { slowSecs++; goodSecs = 0; } else { slowSecs = 0; goodSecs++; }
    if (slowSecs >= 2 && monitorHz / (autoDiv + 1) >= FPS_MIN) { autoDiv++; applyAuto(); }
    else if (goodSecs >= 10 && autoDiv > 1 && work < 300 / Math.round(monitorHz / (autoDiv - 1))) { autoDiv--; applyAuto(); }
  }

  // ---------- цикл ----------
  var STEP = 1000 / 60, acc = 0, last = 0, raf = 0;
  var MAX_TICKS = 15;     // больше тактов за кадр не догоняем (кадр реже ~4 раз в секунду - игра замедлится, а не зависнет)

  function frame(now) {
    raf = requestAnimationFrame(frame);
    if (!last) last = now;
    var dt = now - last;
    last = now;
    if (dt > 0 && dt < 100) {                 // сырые интервалы между кадрами браузера - для определения герцовки
      dts[dtN++] = dt;
      if (dtN === 30) { detectHz(); dtN = 0; }
    }
    if (dt > 250) dt = 250;
    acc += dt;
    var t0 = clock();
    var n = 0;
    while (acc >= STEP && n < MAX_TICKS) { tick(); acc -= STEP; n++; }
    if (n === MAX_TICKS) acc = 0;
    if (now + 1 >= nextRender) {            // 1 мс запас на дрожание кадров
      var interval = 1000 / fpsCap;
      nextRender += interval;
      if (nextRender < now) nextRender = now + interval;
      render(acc / STEP);
      fpsCount++;
      workSum += clock() - t0; workN++;
    }
    if (!fpsStamp) fpsStamp = now;
    else if (now - fpsStamp >= 1000) {
      fpsNow = Math.round(fpsCount * 1000 / (now - fpsStamp));
      var work = workN ? workSum / workN : 0;
      fpsCount = 0; fpsStamp = now; workSum = 0; workN = 0;
      if (fpsAuto) autoStep(work);
      updateFpsLabel(); updateHud();
    }
  }

  function start() { if (!raf) { last = 0; dtN = 0; resetFpsStats(); raf = requestAnimationFrame(frame); } }
  function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } keys = {}; latch = 0; }

  var saved = 0;
  try { saved = parseInt(localStorage.getItem('lowplat.level'), 10) || 0; } catch (e) {}
  loadLevel(saved);
  applyMuteUi();
  syncFpsUi();
  start();
})();
</script>
</body>
</html>
