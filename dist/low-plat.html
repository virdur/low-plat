<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Low Plat</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0c10; color: #8a90a0; font: 13px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #bar { display: flex; align-items: center; gap: 12px; min-height: 26px; }
  #fps { font: inherit; color: inherit; background: #171a22; border: 1px solid #2b3040; border-radius: 4px; padding: 1px 8px; cursor: pointer; }
  #fps:hover { border-color: #3a4054; }
  #c { display: block; width: min(100vw, calc((100vh - 70px) * 16 / 9)); height: auto; image-rendering: pixelated; background: #14161c; }
  #help { min-height: 20px; margin: 6px 12px 0; text-align: center; }
</style>
</head>
<body>
<div id="bar"><span id="hud"></span><button id="fps" type="button" title="Лимит частоты отрисовки (клавиша F). Физика всегда 60 Гц."></button></div>
<canvas id="c"></canvas>
<div id="help">← → / A D — бег · Пробел / ↑ / W — прыжок: чем дольше держишь, тем выше · зажми в сторону стены — держишься и медленно скользишь; тапами по прыжку можно карабкаться вверх, долгое удержание — мощный отскок · R — заново · [ ] — уровень · F — лимит FPS 60/30</div>
<script>
/* Физика и разбор уровней. Никакого DOM: тот же код гоняет tools/solve.js в Node. */
(function (root) {
  'use strict';

  var T = 20;        // размер тайла, px
  var COLS = 32;
  var ROWS = 18;     // поле 640x360
  var SIZE = 14;     // сторона куба

  // всё в px и кадрах (60 кадров/с)
  var C = {
    grav: 0.42,
    maxFall: 8.5,
    slide: 1.4,        // скорость скольжения по стене, когда держишься
    accel: 0.55,
    airAccel: 0.4,
    fric: 0.6,
    airDrag: 0.12,
    maxRun: 3.2,
    // высота прыжка зависит от того, сколько держишь кнопку: стартовая скорость
    // jump, потом пока кнопка зажата (до jumpFrames кадров) к ней добавляется jumpBoost за кадр
    jump: 3.0,
    jumpBoost: 0.62,
    jumpFrames: 10,
    // прыжок со стены: высота растёт с удержанием, как у обычного прыжка.
    // Короткое нажатие даёт небольшой отскок (wallJX): если давишь в стену, куб тут же возвращается к ней,
    // и можно карабкаться тапами. Если держишь кнопку дольше wallXDelay кадров (~100 мс), отскок набирает силу:
    // за оставшиеся кадры к скорости добавляется wallBoostX на кадр, итого около 4.4, как у мощного отскока.
    wallJump: 3.0,
    wallBoost: 0.62,
    wallJX: 1.5,       // толчок от стены на минимальном прыжке
    wallBoostX: 0.9,
    wallFrames: 10,
    wallXDelay: 6,
    coyote: 6,
    wallCoyote: 8,     // после отрыва от стены ещё столько кадров можно оттолкнуться от неё
    buffer: 6
  };

  var EMPTY = 0, SOLID = 1, SPIKE = 2;

  // Уровень -> сетка. ops: ['#'|'^'|'.', x, y, w, h], рамка добавляется сама.
  function parseLevel(def) {
    var grid = new Uint8Array(COLS * ROWS);
    var i, x, y;
    function fill(ch, x0, y0, w, h) {
      var v = ch === '#' ? SOLID : ch === '^' ? SPIKE : EMPTY;
      for (y = y0; y < y0 + h; y++) {
        for (x = x0; x < x0 + w; x++) {
          if (x >= 0 && y >= 0 && x < COLS && y < ROWS) grid[y * COLS + x] = v;
        }
      }
    }
    fill('#', 0, 0, COLS, 1);
    fill('#', 0, ROWS - 1, COLS, 1);
    fill('#', 0, 0, 1, ROWS);
    fill('#', COLS - 1, 0, 1, ROWS);
    for (i = 0; i < def.ops.length; i++) {
      var o = def.ops[i];
      fill(o[0], o[1], o[2], o[3], o[4]);
    }
    return {
      name: def.name,
      grid: grid,
      sx: def.start[0] * T + (T - SIZE) / 2,
      sy: (def.start[1] + 1) * T - SIZE,
      ex: def.exit[0],
      ey: def.exit[1]
    };
  }

  function newState() {
    return { x: 0, y: 0, vx: 0, vy: 0, g: false, jh: false, buf: 0, coyote: 0,
             wallT: 0, wallSide: 0, grip: 0, jt: 0, jb: 0, jx: 0, dead: false, won: false };
  }

  function reset(s, lv) {
    s.x = lv.sx; s.y = lv.sy; s.vx = 0; s.vy = 0;
    s.g = false; s.jh = false; s.buf = 0; s.coyote = 0;
    s.wallT = 0; s.wallSide = 0; s.grip = 0; s.jt = 0; s.jb = 0; s.jx = 0;
    s.dead = false; s.won = false;
  }

  function copyState(a, b) {
    b.x = a.x; b.y = a.y; b.vx = a.vx; b.vy = a.vy; b.g = a.g; b.jh = a.jh;
    b.buf = a.buf; b.coyote = a.coyote; b.wallT = a.wallT; b.wallSide = a.wallSide;
    b.grip = a.grip; b.jt = a.jt; b.jb = a.jb; b.jx = a.jx; b.dead = a.dead; b.won = a.won;
  }

  // Бокс (x,y,SIZE) пересекает твёрдый тайл? Всё за краем поля - стена.
  function hitsSolid(lv, x, y) {
    var x0 = Math.floor(x / T), x1 = Math.floor((x + SIZE - 0.001) / T);
    var y0 = Math.floor(y / T), y1 = Math.floor((y + SIZE - 0.001) / T);
    var tx, ty;
    for (ty = y0; ty <= y1; ty++) {
      for (tx = x0; tx <= x1; tx++) {
        if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return true;
        if (lv.grid[ty * COLS + tx] === SOLID) return true;
      }
    }
    return false;
  }

  function hitsSpike(lv, x, y) {
    var m = 4; // шипы бьют только по "ядру" куба
    var x0 = Math.floor((x + m) / T), x1 = Math.floor((x + SIZE - m) / T);
    var y0 = Math.floor((y + m) / T), y1 = Math.floor((y + SIZE - m) / T);
    var tx, ty;
    for (ty = y0; ty <= y1; ty++) {
      for (tx = x0; tx <= x1; tx++) {
        if (tx >= 0 && ty >= 0 && tx < COLS && ty < ROWS && lv.grid[ty * COLS + tx] === SPIKE) return true;
      }
    }
    return false;
  }

  function approach(v, t, a) {
    return v < t ? Math.min(v + a, t) : Math.max(v - a, t);
  }

  // inp: 1 = влево, 2 = вправо, 4 = прыжок (зажат)
  function step(s, lv, inp) {
    var dir = ((inp & 2) ? 1 : 0) - ((inp & 1) ? 1 : 0);
    var jh = (inp & 4) !== 0;

    if (jh && !s.jh) s.buf = C.buffer; else if (s.buf > 0) s.buf--;
    s.jh = jh;

    // стены рядом (с зазором в 1px)
    var wl = hitsSolid(lv, s.x - 1, s.y);
    var wr = hitsSolid(lv, s.x + 1, s.y);
    s.grip = 0;
    if (!s.g) {
      if (wl || wr) {
        s.wallT = C.wallCoyote;
        s.wallSide = (dir === 1 && wr) ? 1 : (dir === -1 && wl) ? -1 : (wl ? -1 : 1);
      } else if (s.wallT > 0) {
        s.wallT--;
      }
      // держимся за стену только если давим в её сторону
      if (dir === -1 && wl) s.grip = -1;
      else if (dir === 1 && wr) s.grip = 1;
    } else {
      s.wallT = 0;
    }

    // бег; когда отскок от стены набирает силу, куб летит по инерции отскока
    if (!(s.jx !== 0 && s.jt > 0 && jh && C.wallFrames - s.jt >= C.wallXDelay)) {
      var a = dir === 0 ? (s.g ? C.fric : C.airDrag) : (s.g ? C.accel : C.airAccel);
      s.vx = approach(s.vx, dir * C.maxRun, a);
    }

    // прыжок
    if (s.g) s.coyote = C.coyote; else if (s.coyote > 0) s.coyote--;
    if (s.buf > 0) {
      if (s.coyote > 0) {
        s.vy = -C.jump; s.jt = C.jumpFrames; s.jb = C.jumpBoost; s.jx = 0;
        s.coyote = 0; s.buf = 0; s.g = false;
      } else if (s.wallT > 0) {
        s.vy = -C.wallJump; s.jt = C.wallFrames; s.jb = C.wallBoost;
        s.vx = -s.wallSide * C.wallJX;
        s.jx = -s.wallSide * C.wallBoostX;
        s.wallT = 0; s.buf = 0; s.grip = 0;
      }
    }
    if (s.jt > 0) {
      if (jh) {
        s.vy -= s.jb;
        if (s.jx !== 0 && C.wallFrames - s.jt >= C.wallXDelay) s.vx += s.jx;
        s.jt--;
      } else s.jt = 0;
    }

    // гравитация; на стене с нажатием "в стену" падаем медленно
    s.vy += C.grav;
    if (s.grip !== 0 && s.vy > C.slide) s.vy = C.slide;
    else if (s.vy > C.maxFall) s.vy = C.maxFall;

    // движение по осям, скорости < T, так что туннелирования нет
    var nx = s.x + s.vx;
    if (hitsSolid(lv, nx, s.y)) {
      if (s.vx > 0) nx = Math.floor((nx + SIZE - 0.001) / T) * T - SIZE;
      else nx = (Math.floor(nx / T) + 1) * T;
      s.vx = 0;
    }
    s.x = nx;

    var ny = s.y + s.vy;
    s.g = false;
    if (hitsSolid(lv, s.x, ny)) {
      if (s.vy > 0) { ny = Math.floor((ny + SIZE - 0.001) / T) * T - SIZE; s.g = true; }
      else { ny = (Math.floor(ny / T) + 1) * T; s.jt = 0; }
      s.vy = 0;
    }
    s.y = ny;

    if (hitsSpike(lv, s.x, s.y)) s.dead = true;
    var ex = lv.ex * T, ey = lv.ey * T;
    if (s.x + SIZE > ex && s.x < ex + T && s.y + SIZE > ey && s.y < ey + T) s.won = true;
  }

  var LP = root.LP = root.LP || {};
  LP.sim = { T: T, COLS: COLS, ROWS: ROWS, SIZE: SIZE, C: C, EMPTY: EMPTY, SOLID: SOLID, SPIKE: SPIKE,
             parseLevel: parseLevel, newState: newState, reset: reset, copyState: copyState, step: step };
})(typeof globalThis !== 'undefined' ? globalThis : window);
</script>
<script>
/* Уровни: поле 32x18 тайлов, рамка добавляется автоматически.
   ops: ['#' стена | '^' шипы | '.' пусто, x, y, w, h], применяются по порядку.
   start/exit - тайлы (старт: клетка, в которой стоит куб). */
(function (root) {
  'use strict';

  var defs = [
    {

      ops: [
        ['#', 1, 16, 30, 1],

    },

      ]
    },

    },

      ]
    },
    {

      start: [16, 15], exit: [14, 1],
      ops: [
        ['#', 1, 16, 30, 1],
        ['#', 1, 1, 13, 15],
        ['#', 18, 1, 13, 15],
        ['#', 14, 14, 2, 1], ['^', 14, 15, 2, 1],
        ['#', 16, 11, 2, 1], ['^', 16, 12, 2, 1],
        ['#', 14, 8, 2, 1],  ['^', 14, 9, 2, 1],

      ]
    },
    {
      name: 'Тесный колодец',
      start: [16, 15], exit: [24, 2],
      ops: [
        ['#', 1, 16, 30, 1],
        ['#', 1, 3, 14, 13],
        ['#', 17, 3, 14, 13],
        ['^', 15, 13, 1, 2],
        ['^', 16, 9, 1, 2],
        ['^', 15, 5, 1, 2]
      ]
    },
    {
      name: 'Столбики',
      start: [2, 11], exit: [29, 11],
      ops: [
        ['#', 1, 16, 30, 1],
        ['^', 4, 15, 24, 1],
        ['#', 1, 12, 3, 4],
        ['#', 28, 12, 3, 4],
        ['#', 7, 13, 1, 3],
        ['#', 11, 11, 1, 5],
        ['#', 15, 14, 1, 2],
        ['#', 19, 10, 1, 6],
        ['#', 23, 13, 1, 3],
        ['#', 1, 1, 30, 5],
        ['^', 4, 6, 24, 1]
      ]
    },
    {
      name: 'Гонка со стенами',
      start: [2, 15], exit: [8, 2],
      ops: [
        ['#', 1, 16, 30, 1],
        ['#', 1, 3, 14, 10],
        ['^', 1, 13, 14, 1],
        ['^', 8, 15, 2, 1],
        ['^', 12, 15, 2, 1],
        ['#', 19, 3, 12, 13],
        ['#', 15, 9, 2, 1], ['^', 15, 10, 2, 1],
        ['#', 17, 5, 2, 1], ['^', 17, 6, 2, 1]
      ]
    }
  ];

  var LP = root.LP = root.LP || {};
  LP.levelDefs = defs;
})(typeof globalThis !== 'undefined' ? globalThis : window);

<script>
/* Отрисовка, ввод, игровой цикл. Рассчитано на слабые машины:
   - уровень один раз рисуется в offscreen-канвас, в кадре перерисовывается только область вокруг куба;
   - фиксированный шаг 60 Гц, при тормозах игра замедляется, а не копит очередь;
   - нет аллокаций в цикле, DOM пишется только при смене текста (раз в секунду);
   - лимит частоты отрисовки 60/30 (клавиша F или кнопка): физика всегда 60 Гц, режется только рисование;
   - вкладка в фоне -> цикл стоит. */
(function () {
  'use strict';

  var LP = window.LP, sim = LP.sim;
  var T = sim.T, W = sim.COLS * T, H = sim.ROWS * T, SIZE = sim.SIZE;

  var COLORS = { bg: '#14161c', wall: '#3a4054', spike: '#e5484d', exit: '#3dd68c', pole: '#cfd3dc', cube: '#ffc53d', cubeDark: '#b88a12' };
  var HALF_PI = Math.PI / 2, TWO_PI = Math.PI * 2;

  var canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  var ctx = canvas.getContext('2d', { alpha: false });
  var hud = document.getElementById('hud');
  var fpsBtn = document.getElementById('fps');

  var levels = [];
  var i;
  for (i = 0; i < LP.levelDefs.length; i++) levels.push(sim.parseLevel(LP.levelDefs[i]));

  // ---------- кэш уровня ----------
  var cache = document.createElement('canvas');
  cache.width = W; cache.height = H;
  var cctx = cache.getContext('2d', { alpha: false });

  function solidAt(lv, x, y) {
    return x >= 0 && y >= 0 && x < sim.COLS && y < sim.ROWS && lv.grid[y * sim.COLS + x] === sim.SOLID;
  }

  function drawSpike(lv, x, y) {
    var px = x * T, py = y * T, h = 6; // h - зазор: шип в стене или на полу
    // остриё смотрит от соседней стены
    var dx = 0, dy = -1;
    if (solidAt(lv, x, y + 1)) { dx = 0; dy = -1; }
    else if (solidAt(lv, x, y - 1)) { dx = 0; dy = 1; }
    else if (solidAt(lv, x - 1, y)) { dx = 1; dy = 0; }
    else if (solidAt(lv, x + 1, y)) { dx = -1; dy = 0; }
    cctx.beginPath();
    var tipsPerTile = 2, k, bx, by;
    for (k = 0; k < tipsPerTile; k++) {
      var a0 = k * (T / 2), a1 = a0 + T / 2;
      if (dy !== 0) {
        by = dy < 0 ? py + T : py;
        cctx.moveTo(px + a0, by);
        cctx.lineTo(px + (a0 + a1) / 2, by + dy * (T - h));
        cctx.lineTo(px + a1, by);
      } else {
        bx = dx > 0 ? px : px + T;
        cctx.moveTo(bx, py + a0);
        cctx.lineTo(bx + dx * (T - h), py + (a0 + a1) / 2);
        cctx.lineTo(bx, py + a1);
      }
    }
    cctx.fill();
  }

  function buildCache(lv) {
    cctx.fillStyle = COLORS.bg;
    cctx.fillRect(0, 0, W, H);
    cctx.fillStyle = COLORS.wall;
    var x, y, run;
    for (y = 0; y < sim.ROWS; y++) {           // склеиваем горизонтальные участки
      for (x = 0; x < sim.COLS; x++) {
        if (lv.grid[y * sim.COLS + x] !== sim.SOLID) continue;
        run = 1;
        while (x + run < sim.COLS && lv.grid[y * sim.COLS + x + run] === sim.SOLID) run++;
        cctx.fillRect(x * T, y * T, run * T, T);
        x += run - 1;
      }
    }
    cctx.fillStyle = COLORS.spike;
    for (y = 0; y < sim.ROWS; y++) {
      for (x = 0; x < sim.COLS; x++) {
        if (lv.grid[y * sim.COLS + x] === sim.SPIKE) drawSpike(lv, x, y);
      }
    }
    // финиш: флажок на древке, основание на низу клетки
    var fx = lv.ex * T, fy = lv.ey * T;
    cctx.fillStyle = COLORS.pole;
    cctx.fillRect(fx + 6, fy + 1, 2, T - 1);
    cctx.fillRect(fx + 4, fy + T - 2, 6, 2);
    cctx.fillStyle = COLORS.exit;
    cctx.beginPath();
    cctx.moveTo(fx + 8, fy + 2);
    cctx.lineTo(fx + 17, fy + 6);
    cctx.lineTo(fx + 8, fy + 10);
    cctx.fill();
  }

  // ---------- состояние игры ----------
  var levelIdx = 0;
  var lv = levels[0];
  var P = sim.newState();
  var mode = 0;           // 0 игра, 1 смерть, 2 победа
  var modeT = 0;
  var deaths = 0;
  var ticks = 0;          // кадры на текущем уровне
  var needFull = true;    // перерисовать всё
  var lastRect = { x: 0, y: 0, w: 0, h: 0 };
  var lastHud = '';

  // поворот куба: только для вида, на физику не влияет
  var ang = 0, face = 1;
  var SPIN = 0.1;         // рад/такт в воздухе

  var NP = 14;
  var ppx = new Float32Array(NP), ppy = new Float32Array(NP), pvx = new Float32Array(NP), pvy = new Float32Array(NP);
  var pLife = 0;

  function loadLevel(n) {
    levelIdx = (n + levels.length) % levels.length;
    lv = levels[levelIdx];
    buildCache(lv);
    restart();
    ticks = 0;
    try { localStorage.setItem('lowplat.level', String(levelIdx)); } catch (e) {}
  }

  function restart() {
    sim.reset(P, lv);
    mode = 0; pLife = 0; needFull = true;
    ang = 0; face = 1;
  }

  function burst() {
    var k, a;
    pLife = 30;
    for (k = 0; k < NP; k++) {
      a = k * 6.2832 / NP;
      ppx[k] = P.x + SIZE / 2; ppy[k] = P.y + SIZE / 2;
      pvx[k] = Math.cos(a) * (1.5 + (k % 3)) + P.vx * 0.3;
      pvy[k] = Math.sin(a) * (1.5 + (k % 3)) - 1;
    }
  }

  // ---------- ввод (по коду клавиши: работает при любой раскладке) ----------
  var keys = {};
  var KEY_L = { ArrowLeft: 1, KeyA: 1 };
  var KEY_R = { ArrowRight: 1, KeyD: 1 };
  var KEY_J = { ArrowUp: 1, KeyW: 1, Space: 1, KeyZ: 1, KeyK: 1 };

  function inputBits() {
    var b = 0, k;
    for (k in keys) {
      if (!keys[k]) continue;
      if (KEY_L[k]) b |= 1;
      if (KEY_R[k]) b |= 2;
      if (KEY_J[k]) b |= 4;
    }
    return b;
  }

  window.addEventListener('keydown', function (e) {
    var c = e.code;
    if (KEY_L[c] || KEY_R[c] || KEY_J[c] || c === 'KeyR' || c === 'BracketLeft' || c === 'BracketRight') e.preventDefault();
    if (e.repeat) return;
    keys[c] = true;
    if (c === 'KeyF') toggleFps();
    else if (c === 'KeyR' && mode === 0) restart();
    else if (c === 'BracketLeft') loadLevel(levelIdx - 1);
    else if (c === 'BracketRight') loadLevel(levelIdx + 1);
  });
  window.addEventListener('keyup', function (e) { keys[e.code] = false; });
  window.addEventListener('blur', function () { keys = {}; });

  // ---------- такт ----------
  function tick() {
    var k;
    if (mode === 0) {
      sim.step(P, lv, inputBits());
      ticks++;
      if (P.vx > 0.3) face = 1; else if (P.vx < -0.3) face = -1;
      if (!P.g && !P.grip) ang += face * SPIN;                  // в воздухе крутится
      else ang += (Math.round(ang / HALF_PI) * HALF_PI - ang) * 0.35; // на земле и на стене встаёт ровно
      if (ang > TWO_PI) ang -= TWO_PI; else if (ang < -TWO_PI) ang += TWO_PI;
      if (P.dead) { deaths++; burst(); mode = 1; modeT = 36; }
      else if (P.won) { mode = 2; modeT = 40; }
    } else if (mode === 1) {
      for (k = 0; k < NP; k++) { ppx[k] += pvx[k]; ppy[k] += pvy[k]; pvy[k] += 0.25; }
      if (pLife > 0) pLife--;
      if (--modeT <= 0) restart();
    } else if (--modeT <= 0) {
      loadLevel(levelIdx + 1);
    }
  }

  // ---------- отрисовка ----------
  function render() {
    var k, x, y, rx, ry, rw, rh;
    if (needFull || mode === 1) {
      ctx.drawImage(cache, 0, 0);
      needFull = false;
      lastRect.w = 0;
    } else if (lastRect.w) {
      ctx.drawImage(cache, lastRect.x, lastRect.y, lastRect.w, lastRect.h, lastRect.x, lastRect.y, lastRect.w, lastRect.h);
    }
    if (mode === 1) {
      ctx.fillStyle = COLORS.cube;
      var s = pLife > 12 ? 4 : 2;
      for (k = 0; k < NP; k++) ctx.fillRect(ppx[k] - s / 2, ppy[k] - s / 2, s, s);
      return;
    }
    x = Math.round(P.x); y = Math.round(P.y);
    if (Math.abs(ang - Math.round(ang / HALF_PI) * HALF_PI) < 0.02) {   // ровный куб: быстрый путь без сглаживания
      ctx.fillStyle = COLORS.cubeDark;
      ctx.fillRect(x, y, SIZE, SIZE);
      ctx.fillStyle = COLORS.cube;
      ctx.fillRect(x + 2, y + 2, SIZE - 4, SIZE - 4);
    } else {
      var c = Math.cos(ang), s = Math.sin(ang), h = SIZE / 2;
      ctx.setTransform(c, s, -s, c, x + h, y + h);
      ctx.fillStyle = COLORS.cubeDark;
      ctx.fillRect(-h, -h, SIZE, SIZE);
      ctx.fillStyle = COLORS.cube;
      ctx.fillRect(-h + 2, -h + 2, SIZE - 4, SIZE - 4);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }
    // повёрнутый куб выступает за свой бокс на ~3 px: запас с каждой стороны 5 px
    rx = Math.max(0, x - 5); ry = Math.max(0, y - 5);
    rw = Math.min(W - rx, SIZE + 10); rh = Math.min(H - ry, SIZE + 10);
    lastRect.x = rx; lastRect.y = ry; lastRect.w = rw; lastRect.h = rh;
  }

  function updateHud() {
    var s = Math.floor(ticks / 60);
    var txt = 'Уровень ' + (levelIdx + 1) + '/' + levels.length + ' · ' + lv.name + ' · смертей: ' + deaths + ' · ' + s + ' с';
    if (txt !== lastHud) { hud.textContent = txt; lastHud = txt; }
  }

  // ---------- лимит FPS ----------
  var fpsCap = 60, fpsNow = 0, fpsCount = 0, fpsStamp = 0, lastRender = 0, ticked = false;
  try { if (localStorage.getItem('lowplat.fps') === '30') fpsCap = 30; } catch (e) {}

  function updateFpsBtn() {
    var txt = 'FPS: ' + (fpsNow || fpsCap) + ' (лимит ' + fpsCap + ')';
    if (fpsBtn.textContent !== txt) fpsBtn.textContent = txt;
  }

  function toggleFps() {
    fpsCap = fpsCap === 60 ? 30 : 60;
    try { localStorage.setItem('lowplat.fps', String(fpsCap)); } catch (e) {}
    fpsCount = 0; fpsStamp = 0; fpsNow = 0;
    updateFpsBtn();
  }

  fpsBtn.addEventListener('click', function () { toggleFps(); fpsBtn.blur(); }); // blur: чтобы пробел не нажимал кнопку

  // ---------- цикл ----------
  var STEP = 1000 / 60, acc = 0, last = 0, raf = 0;

  function frame(now) {
    raf = requestAnimationFrame(frame);
    if (!last) last = now;
    var dt = now - last;
    last = now;
    if (dt > 100) dt = 100;
    acc += dt;
    var n = 0;
    while (acc >= STEP && n < 4) { tick(); acc -= STEP; n++; }
    if (n === 4) acc = 0;
    if (n > 0) ticked = true;
    if (ticked && now - lastRender >= 1000 / fpsCap - 4) {  // 4 мс запас на дрожание кадров
      lastRender = now; ticked = false;
      render(); updateHud();
      fpsCount++;
    }
    if (!fpsStamp) fpsStamp = now;
    else if (now - fpsStamp >= 1000) {
      fpsNow = Math.round(fpsCount * 1000 / (now - fpsStamp));
      fpsCount = 0; fpsStamp = now;
      updateFpsBtn();
    }
  }

  function start() { if (!raf) { last = 0; raf = requestAnimationFrame(frame); } }
  function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } keys = {}; }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); else start(); });

  var saved = 0;
  try { saved = parseInt(localStorage.getItem('lowplat.level'), 10) || 0; } catch (e) {}
  loadLevel(saved);
  updateFpsBtn();
  start();
})();
</script>
</body>
</html>
